    <circle cx="50" cy="50" r="70" fill="url(#iconGrad)"/>
    <path d="M50 85 V35 M25 55 L50 25 L75 55" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- ITI text -->
  <text x="256" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#fff" opacity="0.9">ITI COPA</text>

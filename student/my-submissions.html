<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Submissions - ITI COPA Student</title>
        
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../icons/icon-192x192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
    <div class="sidebar-overlay" onclick="toggleMobileMenu()"></div>

    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="../index.html" class="logo">
                <div class="logo-icon">📚</div>
                <span>ITI COPA</span>
            </a>

            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="projects.html"><span class="icon">📁</span> Projects</a></li>
                <li><a href="submit.html"><span class="icon">📤</span> Submit Project</a></li>
                <li><a href="my-submissions.html" class="active"><span class="icon">📋</span> My Submissions</a></li>
                <li><a href="my-results.html"><span class="icon">📝</span> My Results</a></li>
                <li><a href="#" onclick="studentLogout()"><span class="icon">🚪</span> Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>📋 My Submissions</h1>
                    <p class="welcome-text">View your submission history</p>
                </div>
                <a href="submit.html" class="btn btn-primary">📤 Submit New</a>
            </div>

            <!-- Submissions List -->
            <div id="submissionsList">
                <div class="text-center mt-4">
                    <span class="loader"></span>
                    <p class="text-muted mt-2">Loading submissions...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student.js"></script>
    <script>
        // Protect route
        if (!protectStudentRoute()) { }

        // Load my submissions
        async function loadSubmissions() {
            const submissions = await getMySubmissions();
            renderMySubmissions(submissions, 'submissionsList');
        }

        loadSubmissions();
    </script>
    <script src="../js/pwa.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - ITI COPA Student</title>
        
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../icons/icon-192x192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
    <div class="sidebar-overlay" onclick="toggleMobileMenu()"></div>

    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="../index.html" class="logo">
                <div class="logo-icon">📚</div>
                <span>ITI COPA</span>
            </a>

            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="projects.html" class="active"><span class="icon">📁</span> Projects</a></li>
                <li><a href="submit.html"><span class="icon">📤</span> Submit Project</a></li>
                <li><a href="my-submissions.html"><span class="icon">📋</span> My Submissions</a></li>
                <li><a href="my-results.html"><span class="icon">📝</span> My Results</a></li>
                <li><a href="#" onclick="studentLogout()"><span class="icon">🚪</span> Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>📁 Available Projects</h1>
                    <p class="welcome-text">View and download project assignments</p>
                </div>
            </div>

            <!-- Projects Grid -->
            <div id="projectsGrid">
                <div class="text-center mt-4">
                    <span class="loader"></span>
                    <p class="text-muted mt-2">Loading projects...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student.js"></script>
    <script>
        // Protect route
        if (!protectStudentRoute()) { }

        // Load projects
        async function loadProjects() {
            const projects = await getAvailableProjects();
            renderStudentProjectsGrid(projects, 'projectsGrid');
        }

        loadProjects();
    </script>
    <script src="../js/pwa.js"></script>
</body>

</html>

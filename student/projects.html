<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects - ITI COPA Student</title>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="apple-touch-icon" href="../icons/icon-192x192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* Tabs Styling */
        .project-tabs {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            background: var(--bg-card);
            padding: 0.5rem;
            border-radius: var(--radius);
            border: 1px solid var(--border);
        }

        .project-tabs .tab-btn {
            flex: 1;
            padding: 0.875rem 1.5rem;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 1rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .project-tabs .tab-btn:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
        }

        .project-tabs .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .project-tabs .tab-btn .count-badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.2rem 0.5rem;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .project-tabs .tab-btn.active .count-badge {
            background: rgba(255, 255, 255, 0.3);
        }

        .tab-btn:not(.active) .count-badge {
            background: var(--bg-input);
        }
    </style>
</head>

<body>
    <!-- Mobile Menu Toggle -->
    <button class="mobile-menu-toggle" onclick="toggleMobileMenu()">☰</button>
    <div class="sidebar-overlay" onclick="toggleMobileMenu()"></div>

    <div class="layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="../index.html" class="logo">
                <div class="logo-icon">📚</div>
                <span>ITI COPA</span>
            </a>

            <ul class="sidebar-nav">
                <li><a href="dashboard.html"><span class="icon">📊</span> Dashboard</a></li>
                <li><a href="projects.html" class="active"><span class="icon">📁</span> Projects</a></li>
                <li><a href="submit.html"><span class="icon">📤</span> Submit Project</a></li>
                <li><a href="my-submissions.html"><span class="icon">📋</span> My Submissions</a></li>
                <li><a href="my-results.html"><span class="icon">📝</span> My Results</a></li>
                <li><a href="#" onclick="studentLogout()"><span class="icon">🚪</span> Logout</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="page-header">
                <div>
                    <h1>📁 Available Projects</h1>
                    <p class="welcome-text">View and download project assignments</p>
                </div>
            </div>

            <!-- Tabs for Active/Old Projects -->
            <div class="project-tabs">
                <button class="tab-btn active" id="activeTab" onclick="switchTab('active')">
                    🟢 Active Projects <span class="count-badge" id="activeCount">0</span>
                </button>
                <button class="tab-btn" id="oldTab" onclick="switchTab('old')">
                    📦 Old Projects <span class="count-badge" id="oldCount">0</span>
                </button>
            </div>

            <!-- Projects Grid -->
            <div id="projectsGrid">
                <div class="text-center mt-4">
                    <span class="loader"></span>
                    <p class="text-muted mt-2">Loading projects...</p>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/student.js"></script>
    <script>
        // Protect route
        if (!protectStudentRoute()) { }

        let allProjects = [];
        let currentTab = 'active';

        // Check if project is active (deadline not passed or no deadline)
        function isProjectActive(project) {
            if (!project.deadline) return true; // No deadline = always active
            return new Date(project.deadline) > new Date();
        }

        // Switch tab
        function switchTab(tab) {
            currentTab = tab;

            // Update tab buttons
            document.getElementById('activeTab').classList.toggle('active', tab === 'active');
            document.getElementById('oldTab').classList.toggle('active', tab === 'old');

            // Render filtered projects
            renderFilteredProjects();
        }

        // Render filtered projects based on current tab
        function renderFilteredProjects() {
            const activeProjects = allProjects.filter(p => isProjectActive(p));
            const oldProjects = allProjects.filter(p => !isProjectActive(p));

            // Update counts
            document.getElementById('activeCount').textContent = activeProjects.length;
            document.getElementById('oldCount').textContent = oldProjects.length;

            // Render based on current tab
            const projectsToShow = currentTab === 'active' ? activeProjects : oldProjects;

            if (projectsToShow.length === 0) {
                document.getElementById('projectsGrid').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">${currentTab === 'active' ? '📁' : '📦'}</div>
                        <h3>${currentTab === 'active' ? 'No Active Projects' : 'No Old Projects'}</h3>
                        <p>${currentTab === 'active' ? 'कोई active project नहीं है अभी' : 'Expired projects यहाँ दिखेंगे'}</p>
                    </div>
                `;
                return;
            }

            renderStudentProjectsGrid(projectsToShow, 'projectsGrid');
        }

        // Load projects
        async function loadProjects() {
            allProjects = await getAvailableProjects();
            renderFilteredProjects();
        }

        loadProjects();
    </script>
    <script src="../js/pwa.js"></script>
</body>

</html>
